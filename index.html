<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyPulse - Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>SkyPulse <span>Weather</span></h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="forecast.html">Forecast</a>
    <a href="compare.html">Compare</a>
    <a href="manage.html">Manage Cities</a>
  </nav>
</header>

<main class="dashboard-main">
  <section class="search-section">
    <div class="search-bar">
      <input type="text" id="city-input" placeholder="Enter city name...">
      <button id="search-btn" class="btn btn-primary">Search</button>
      <button id="geo-btn" class="btn btn-secondary">Locate Me</button>
    </div>
    <p id="error-msg" class="error-msg"></p>
  </section>

  <section class="weather-card" id="weather-card"></section>

  <section class="saved-chips">
    <h2>Saved Cities</h2>
    <div id="city-chips"></div>
  </section>
</main>

<footer class="app-footer">
  <p>SkyPulse - Advanced Live Weather Dashboard</p>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
